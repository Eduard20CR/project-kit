name: Spike
description: A time-boxed investigation to answer a question before deciding.
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What we need to find out, and which decision it unblocks.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: Maximum effort (e.g. 2 hours).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] Findings written in docs/spikes/NNNN-slug.md, from docs/spikes/template.md.\n- [ ] Recommendation given; an ADR is proposed if the decision is hard to reverse."
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed first. Leave empty if none.
