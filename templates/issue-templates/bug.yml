name: Bug
description: Something that broke.
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What was expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where it happened (e.g. production, local).
    validations:
      required: true
