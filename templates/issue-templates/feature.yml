name: Feature
description: Something the user can do or notice.
labels: ["type:feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      value: "As a **<role>**, I want <capability>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions. Include exact user-facing texts in quotes.
      value: "- [ ] **Given** <context>, **when** <action>, **then** <result>."
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: References
      description: Requirement and ADR IDs (e.g. FR-03, NFR-SEC-01, ADR-0002).
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Files or folders this issue is expected to touch.
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed first (e.g. #4, #7). Leave empty if none.
  - type: textarea
    id: notes
    attributes:
      label: Notes
