name: Technical item
description: Necessary work the user does not see. Child of an epic.
labels: ["type:technical"]
body:
  - type: markdown
    attributes:
      value: "The title is a verb with what is done (e.g. Set up the deploy pipeline to AWS)."
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One line (e.g. so that every push to main is tested and deployed on its own).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Written in the issue when the technical item is refined, right before building it.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Written in the issue when the technical item is refined, right before building it.
