name: Story
description: Something the user notices. Child of an epic.
labels: ["type:story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: e.g. As a guest, I want to upload up to 10 photos, so that they are in the event gallery.
      value: "As a <role>, I want (or need) <action>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Written in the issue when the story is refined, right before building it.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Written in the issue when the story is refined, right before building it.
