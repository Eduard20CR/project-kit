name: Task
description: A technical piece of a story or technical item. One pull request each. With no parent, it is a loose task (e.g. updating dependencies).
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is done, and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: References
      description: Non-functional requirement and ADR IDs (e.g. NFR-COST-01, ADR-0005).
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Files or folders this issue is expected to touch.
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed first (e.g. #4, #7). Leave empty if none.
  - type: textarea
    id: notes
    attributes:
      label: Notes
