name: Technical task
description: Enabling work with no direct user value (infrastructure, CI/CD, refactoring, ADR).
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is done, and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: References
      description: Requirement and ADR IDs (e.g. NFR-COST-01, ADR-0005).
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Files or folders this issue is expected to touch.
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed first (e.g. #4, #7). Leave empty if none.
  - type: textarea
    id: notes
    attributes:
      label: Notes
